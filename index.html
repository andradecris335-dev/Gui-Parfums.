<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gui Parfums | Catálogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #111111; --green: #25d366; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 50px; }
        .container { width: 100%; max-width: 500px; margin: auto; padding: 20px; box-sizing: border-box; }
        
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER */
        .profile { text-align: center; margin-bottom: 30px; }
        .logo-box { position: relative; display: inline-block; width: 110px; height: 110px; }
        .logo-box img { width: 110px; height: 110px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .admin-trigger { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: none; background: transparent; cursor: pointer; }

        /* CATALOGO */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-card { background: var(--card); padding: 12px; border-radius: 15px; border: 1px solid #222; text-align: center; }
        .p-card img { width: 100%; height: 130px; object-fit: contain; background: #fff; border-radius: 8px; margin-bottom: 10px; }
        
        /* MODO ADMIN */
        .admin-only { display: none; margin-top: 10px; border-top: 1px dashed #444; padding-top: 10px; }
        .is-admin .admin-only { display: block; }
        #admin-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 15px; border-top: 2px solid var(--gold); gap: 10px; z-index: 1000; }
        
        /* ESTILO DOS INPUTS E BOTÕES */
        .btn-link { display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid #222; color: white; padding: 18px; margin-bottom: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; cursor: pointer; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--gold); padding: 8px; border-radius: 5px; margin-bottom: 5px; box-sizing: border-box; }

        /* MODAL ESTILIZADO (MENSAGENS DE ATIVAÇÃO) */
        #custom-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; 
        }
        .modal-content { 
            background: #151515; border: 1px solid var(--gold); padding: 25px; 
            border-radius: 20px; width: 85%; max-width: 350px; text-align: center; 
        }
        .modal-content h3 { color: var(--gold); margin-top: 0; }
        .btn-modal { 
            background: var(--gold); color: #000; border: none; padding: 12px 25px; 
            border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%;
        }
    </style>
</head>
<body>

<div id="custom-modal">
    <div class="modal-content" id="modal-body">
        <!-- Conteúdo inserido via JS -->
    </div>
</div>

<div class="container" id="main-app">
    <div id="home" class="page active">
        <div class="profile">
            <div class="logo-box">
                <img id="logo-img" src="WhatsApp Image 2026-05-04 at 18.46.47.jpeg">
                <button class="admin-trigger" onclick="cliqueLogo()"></button>
            </div>
            <div class="admin-only">
                <p style="font-size: 10px; color: var(--gold);">URL DA LOGO:</p>
                <input type="text" id="input-logo">
            </div>
            <h2>Gui Parfums</h2>
            <p style="color: #666;">Sua essência, sua marca.</p>
        </div>
        <div class="btn-link" onclick="navegar('catalog')">Abrir Catálogo</div>
        <a href="https://wa.me/qr/O4T3FOBIPCKJJ1" class="btn-link" style="color:var(--green)">Fazer Pedido</a>
    </div>

    <div id="catalog" class="page">
        <div style="display:flex; align-items:center; margin-bottom:20px">
            <i class="fas fa-arrow-left" onclick="navegar('home')" style="color:var(--gold); padding:10px; cursor:pointer"></i>
            <h2 style="margin:0">Catálogo</h2>
        </div>
        <div id="produtos-grid" class="grid"></div>
    </div>

    <div id="admin-bar">
        <button onclick="novoItem()" style="flex:1; background:var(--gold); padding:12px; border-radius:8px; border:none; font-weight:bold;">＋ ITEM</button>
        <button onclick="salvarNoBanco()" style="flex:1; background:#fff; padding:12px; border-radius:8px; border:none; font-weight:bold;">💾 SALVAR</button>
        <button onclick="fecharAdmin()" style="flex:1; background:#ff4444; color:#fff; padding:12px; border-radius:8px; border:none; font-weight:bold;">✕ SAIR</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gui-parfums-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dados = { produtos: [], logo: "WhatsApp Image 2026-05-04 at 18.46.47.jpeg" };
    let contagem = 0;

    // --- SISTEMA DE MODAL ESTILIZADO ---
    function mostrarAviso(titulo, msg, temInput = false, callback = null) {
        const modal = document.getElementById('custom-modal');
        const body = document.getElementById('modal-body');
        modal.style.display = 'flex';
        
        body.innerHTML = `
            <h3>${titulo}</h3>
            <p>${msg}</p>
            ${temInput ? '<input type="password" id="modal-input" placeholder="Digite aqui..." style="text-align:center">' : ''}
            <button class="btn-modal" id="modal-confirm">OK</button>
        `;

        document.getElementById('modal-confirm').onclick = () => {
            const val = temInput ? document.getElementById('modal-input').value : null;
            modal.style.display = 'none';
            if(callback) callback(val);
        };
    }

    db.ref('/').on('value', (snap) => {
        const val = snap.val();
        if(val) {
            dados.produtos = val.produtos || [];
            dados.logo = val.logo || dados.logo;
            renderizar();
        }
    });

    function renderizar() {
        document.getElementById('logo-img').src = dados.logo;
        document.getElementById('input-logo').value = dados.logo;
        const grid = document.getElementById('produtos-grid');
        grid.innerHTML = dados.produtos.map((item, i) => `
            <div class="p-card">
                <img src="${item.img || 'https://via.placeholder.com/150'}">
                <h4>${item.nome}</h4>
                <p style="color:var(--gold)">${item.preco}</p>
                <div class="admin-only">
                    <input type="text" value="${item.nome}" id="edit-n-${i}">
                    <input type="text" value="${item.preco}" id="edit-p-${i}">
                    <input type="text" value="${item.img}" id="edit-i-${i}">
                </div>
                <button onclick="window.open('https://wa.me/qr/O4T3FOBIPCKJJ1')" style="background:var(--green); border:none; width:100%; padding:8px; border-radius:5px; color:#fff; font-weight:bold; margin-top:5px">Comprar</button>
            </div>
        `).join('');
    }

    function cliqueLogo() {
        contagem++;
        if(contagem >= 5) {
            contagem = 0;
            mostrarAviso("Acesso Restrito", "Insira a senha do desenvolvedor para continuar:", true, (senha) => {
                if(senha === "gui123") {
                    document.getElementById('main-app').classList.add('is-admin');
                    document.getElementById('admin-bar').style.display = 'flex';
                    renderizar();
                } else {
                    mostrarAviso("Erro", "Senha incorreta!");
                }
            });
        }
    }

    function salvarNoBanco() {
        dados.logo = document.getElementById('input-logo').value;
        dados.produtos.forEach((item, i) => {
            item.nome = document.getElementById(`edit-n-${i}`).value;
            item.preco = document.getElementById(`edit-p-${i}`).value;
            item.img = document.getElementById(`edit-i-${i}`).value;
        });
        db.ref('/').set(dados).then(() => {
            mostrarAviso("Sucesso", "Todas as alterações foram salvas na nuvem!");
        });
    }

    function navegar(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function novoItem() { dados.produtos.push({nome: "Novo", preco: "R$ 0,00", img: ""}); renderizar(); }
    function fecharAdmin() { 
        document.getElementById('main-app').classList.remove('is-admin'); 
        document.getElementById('admin-bar').style.display = 'none'; 
        navegar('home'); 
    }
</script>
</body>
</html>
