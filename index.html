<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gui Parfums | Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8d08a;
            --gold-dim: #8a6f2e;
            --dark: #080808;
            --dark-2: #0f0f0f;
            --card: #111111;
            --card-hover: #181818;
            --green: #25d366;
            --text: #e8e8e8;
            --text-muted: #666;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px 80px;
            position: relative;
            z-index: 1;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 0 36px;
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 22px;
        }

        .logo-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid var(--gold-dim);
            animation: rotateSlow 20s linear infinite;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
        }

        @keyframes rotateSlow { to { transform: rotate(360deg); } }

        .logo-box { position: relative; width: 110px; height: 110px; }

        .logo-box img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--gold-dim);
            object-fit: cover;
            display: block;
        }

        .admin-trigger {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 2;
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 6px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-tagline {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--gold-dim);
            text-transform: uppercase;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 28px auto;
        }

        .home-actions { display: flex; flex-direction: column; gap: 14px; }

        .btn-catalog {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--gold);
            color: #000;
            padding: 18px 24px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-catalog:hover { background: var(--gold-light); transform: translateY(-1px); }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: transparent;
            color: var(--text);
            padding: 18px 24px;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s, transform 0.2s;
        }

        .btn-whatsapp:hover { border-color: var(--green); color: var(--green); transform: translateY(-1px); }
        .btn-whatsapp i { font-size: 16px; color: var(--green); }

        .admin-only { display: none; margin-top: 12px; width: 100%; }
        .is-admin .admin-only { display: block; }
        .admin-label { font-size: 9px; letter-spacing: 2px; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 5px; }

        .catalog-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 36px 0 24px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #222;
            background: transparent;
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .back-btn:hover { border-color: var(--gold); background: #111; }

        .catalog-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
        }

        .catalog-subtitle { font-size: 9px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .p-card {
            background: var(--card);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.25s, transform 0.25s;
        }

        .p-card:hover { border-color: var(--gold-dim); transform: translateY(-3px); }

        .p-card-img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #fff;
            display: block;
        }

        .p-card-body { padding: 12px 12px 10px; }

        .p-card-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            line-height: 1.3;
        }

        .p-card-price {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn-buy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: transparent;
            border: 1px solid #2a2a2a;
            color: var(--green);
            padding: 8px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-buy:hover { background: rgba(37,211,102,0.08); border-color: var(--green); }
        .btn-buy i { font-size: 12px; }

        .p-card .admin-only {
            padding: 10px;
            border-top: 1px dashed #2a2a2a;
            margin-top: 8px;
            background: #0a0a0a;
        }

        #admin-bar {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #0d0d0d;
            padding: 12px 16px;
            border-top: 1px solid var(--gold-dim);
            gap: 8px;
            z-index: 1000;
            align-items: center;
        }

        .admin-bar-inner { display: flex; gap: 8px; width: 100%; max-width: 480px; margin: 0 auto; }

        .admin-btn {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .admin-btn:hover { opacity: 0.85; }
        .admin-btn-add  { background: var(--gold); color: #000; }
        .admin-btn-save { background: #fff; color: #000; }
        .admin-btn-exit { background: #c0392b; color: #fff; }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: #050505;
            border: 1px solid #2a2a2a;
            color: var(--gold-light);
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--gold-dim); }

        #custom-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #0f0f0f;
            border: 1px solid var(--gold-dim);
            padding: 36px 28px;
            border-radius: 12px;
            width: 88%;
            max-width: 340px;
            text-align: center;
        }

        .modal-icon { font-size: 28px; color: var(--gold); margin-bottom: 14px; }

        .modal-content h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 400;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .modal-content p { font-size: 12px; color: #888; letter-spacing: 0.5px; line-height: 1.6; }

        .btn-modal {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-modal:hover { background: var(--gold-light); }

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 50px 20px;
            color: #333;
        }

        .empty-state i { font-size: 36px; margin-bottom: 14px; color: #222; display: block; }
        .empty-state p { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="custom-modal">
    <div class="modal-content" id="modal-body"></div>
</div>

<div class="container" id="main-app">

    <div id="home" class="page active">
        <div class="hero">
            <div class="logo-wrapper">
                <div class="logo-ring"></div>
                <div class="logo-box">
                    <img id="logo-img" src="WhatsApp Image 2026-05-04 at 18.46.47.jpeg" alt="Gui Parfums">
                    <button class="admin-trigger" onclick="cliqueLogo()" aria-label="Admin"></button>
                </div>
            </div>
            <h1 class="brand-name">Gui Parfums</h1>
            <p class="brand-tagline">Sua essência, sua marca</p>

            <div class="admin-only">
                <p class="admin-label">URL da Logo</p>
                <input type="text" id="input-logo" placeholder="URL da imagem...">
            </div>
        </div>

        <div class="divider"></div>

        <div class="home-actions">
            <button class="btn-catalog" onclick="navegar('catalog')">
                <i class="fas fa-spray-can"></i> Ver Catálogo
            </button>
            <a href="https://wa.me/qr/O4T3FOBIPCKJJ1" class="btn-whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> Fazer Pedido
            </a>
        </div>
    </div>

    <div id="catalog" class="page">
        <div class="catalog-header">
            <button class="back-btn" onclick="navegar('home')">
                <i class="fas fa-arrow-left" style="font-size:13px"></i>
            </button>
            <div>
                <div class="catalog-title">Catálogo</div>
                <div class="catalog-subtitle">Coleção de Fragrâncias</div>
            </div>
        </div>
        <div id="produtos-grid" class="grid"></div>
    </div>

</div>

<div id="admin-bar">
    <div class="admin-bar-inner">
        <button class="admin-btn admin-btn-add" onclick="novoItem()">＋ Item</button>
        <button class="admin-btn admin-btn-save" onclick="salvarNoBanco()">💾 Salvar</button>
        <button class="admin-btn admin-btn-exit" onclick="fecharAdmin()">✕ Sair</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gui-parfums-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dados = { produtos: [], logo: "WhatsApp Image 2026-05-04 at 18.46.47.jpeg" };
    let contagem = 0;

    function mostrarAviso(titulo, msg, temInput = false, callback = null, icone = "fa-lock") {
        const modal = document.getElementById('custom-modal');
        const body  = document.getElementById('modal-body');
        modal.style.display = 'flex';
        body.innerHTML = `
            <div class="modal-icon"><i class="fas ${icone}"></i></div>
            <h3>${titulo}</h3>
            <p>${msg}</p>
            ${temInput ? '<input type="password" id="modal-input" placeholder="••••••" style="text-align:center; margin-top:14px">' : ''}
            <button class="btn-modal" id="modal-confirm">Confirmar</button>
        `;
        document.getElementById('modal-confirm').onclick = () => {
            const val = temInput ? document.getElementById('modal-input').value : null;
            modal.style.display = 'none';
            if (callback) callback(val);
        };
    }

    db.ref('/').on('value', (snap) => {
        const val = snap.val();
        if (val) {
            dados.produtos = val.produtos || [];
            dados.logo     = val.logo || dados.logo;
            renderizar();
        }
    });

    function renderizar() {
        document.getElementById('logo-img').src     = dados.logo;
        document.getElementById('input-logo').value = dados.logo;

        const grid = document.getElementById('produtos-grid');

        if (!dados.produtos.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-wind"></i>
                    <p>Nenhum produto ainda</p>
                </div>`;
            return;
        }

        grid.innerHTML = dados.produtos.map((item, i) => `
            <div class="p-card">
                <img class="p-card-img" src="${item.img || 'https://placehold.co/300x280/111/444?text=Perfume'}" alt="${item.nome}" loading="lazy">
                <div class="p-card-body">
                    <div class="p-card-name">${item.nome}</div>
                    <div class="p-card-price">${item.preco}</div>
                    <button class="btn-buy" onclick="window.open('https://wa.me/qr/O4T3FOBIPCKJJ1')">
                        <i class="fab fa-whatsapp"></i> Comprar
                    </button>
                    <div class="admin-only">
                        <input type="text" value="${item.nome}"  id="edit-n-${i}" placeholder="Nome">
                        <input type="text" value="${item.preco}" id="edit-p-${i}" placeholder="Preço">
                        <input type="text" value="${item.img}"   id="edit-i-${i}" placeholder="URL da imagem">
                    </div>
                </div>
            </div>
        `).join('');
    }

    function cliqueLogo() {
        contagem++;
        if (contagem >= 5) {
            contagem = 0;
            mostrarAviso(
                "Acesso Restrito",
                "Insira a senha do desenvolvedor para continuar.",
                true,
                (senha) => {
                    if (senha === "gui123") {
                        document.getElementById('main-app').classList.add('is-admin');
                        document.getElementById('admin-bar').style.display = 'flex';
                        renderizar();
                    } else {
                        mostrarAviso("Acesso Negado", "Senha incorreta. Tente novamente.", false, null, "fa-ban");
                    }
                },
                "fa-key"
            );
        }
    }

    function salvarNoBanco() {
        dados.logo = document.getElementById('input-logo').value;
        dados.produtos.forEach((item, i) => {
            item.nome  = document.getElementById(`edit-n-${i}`).value;
            item.preco = document.getElementById(`edit-p-${i}`).value;
            item.img   = document.getElementById(`edit-i-${i}`).value;
        });
        db.ref('/').set(dados).then(() => {
            mostrarAviso("Salvo!", "Todas as alterações foram salvas na nuvem.", false, null, "fa-check-circle");
        });
    }

    function navegar(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0, 0);
    }

    function novoItem() {
        dados.produtos.push({ nome: "Novo Perfume", preco: "R$ 0,00", img: "" });
        renderizar();
        navegar('catalog');
    }

    function fecharAdmin() {
        document.getElementById('main-app').classList.remove('is-admin');
        document.getElementById('admin-bar').style.display = 'none';
        navegar('home');
    }
</script>
</body>
</html>
